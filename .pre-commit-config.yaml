# Generated by setup-hooks.sh on 2026-10-20. Runner: prek.
# Update revs with 'prek update --cooldown-days 7'.
# Generated files: Rcpp::compileAttributes() rewrites R/RcppExports.R and
# vignette builds rewrite doc/, so hook fixes there would be undone.
exclude: '^(R/RcppExports\.R|doc/)'
# Base: prek's own builtin hooks. No clone, no Python venv, works offline.
# WARNING: `repo: builtin` is prek-only. This config NO LONGER runs under
# the original pre-commit. Most useful in pure R repos, where a Python
# environment would otherwise exist only for the whitespace hooks.
# Check the IDs available in the installed version: prek util list-builtins -v
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # R formatting via air. Single binary, needs neither R nor renv.
  # Formats only .R/.r; since air 0.9, .qmd and default excludes such as
  # cpp11.R are skipped even when the hook passes them.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.12.0
    hooks:
      - id: air-format

  # Fast R linting via jarl on commit. Rust binary built on air, needs no R
  # and no renv. The hook is language: python and installs jarl once into a
  # hook venv. Also checks .Rmd/.qmd. Covers only part of lintr's rules (no
  # semantic analysis, no formatting rules; air handles formatting).
  - repo: https://github.com/etiennebacher/jarl-pre-commit
    rev: 0.6.0
    hooks:
      - id: jarl-check

  # Full R linting via lintr, only on push: needs a system Rscript and
  # restores a renv environment, the slow part of the setup. Catches what
  # jarl does not cover (yet). For lintr on commit, remove the stages line.
  # Linters and exclusions come from .lintr, shared with the CI gate's r-lint.
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9032
    hooks:
      - id: lintr
        stages: [pre-push]

  # Secret scanning, included for every project type: the commit hook is the
  # last point before a secret lands in history. Mirrors the gitleaks job of
  # the CI gate. rev set by `prek update --cooldown-days 7` on 2026-10-12,
  # never hand-pinned. language: golang, so prek fetches a Go toolchain and
  # builds gitleaks on first run.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
