# Workflow derived from https://github.com/posit-dev/setup-air/tree/main/examples
# Read-only: fails when air would reformat a file; never commits. Fix locally
# with `air format .` (or the air-format prek hook) and push the result.
on:
  push:
    branches: [main, master]
  pull_request:

name: format-check.yaml

permissions: read-all

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install air
        uses: posit-dev/setup-air@fd20dd239848b9d807848a7ab92265cf197de694 # v1.0.2
        with:
          # Keep in step with the air-format rev in .pre-commit-config.yaml.
          version: "0.12.0"

      - name: Check formatting
        run: air format . --check
